# 手动触发构建 hob-desktop-chromix（Chromix 浏览器变体），推 ghcr.io/<owner>/hob-desktop-chromix。
# 常规发版（v* tag）走 docker.yml，只构建官方桌面镜像；chromix 变体按需构建。
name: docker-chromix

on:
  workflow_dispatch:
    inputs:
      version:
        description: "镜像 tag（默认 v<package版本>-chromix）"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: hob-desktop-chromix
            context: desktop
            dockerfile: Dockerfile.chromix
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then v="v$(node -p 'require("./package.json").version')-chromix"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
